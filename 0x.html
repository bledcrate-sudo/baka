<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0x — Shugi AI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #7c6af7;
    --accent2: #e84393;
    --text: #e8e8f0;
    --muted: #7070a0;
    --green: #00b894;
    --red: #e17055;
    --yellow: #fdcb6e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─────────────────── LOGIN ─────────────────── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Animated gradient blob */
  .login-blob {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,106,247,0.18) 0%, rgba(232,67,147,0.10) 45%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: blobDrift 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  .login-blob-2 {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,184,148,0.10) 0%, transparent 70%);
    bottom: 10%;
    right: 10%;
    animation: blobDrift2 11s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes blobDrift {
    0%   { transform: translate(-50%, -50%) scale(1); }
    50%  { transform: translate(-48%, -53%) scale(1.08); }
    100% { transform: translate(-52%, -47%) scale(0.96); }
  }
  @keyframes blobDrift2 {
    0%   { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.15) translate(-20px, -30px); }
  }

  .login-box {
    background: rgba(22, 22, 26, 0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(124, 106, 247, 0.2);
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 32px 64px rgba(0,0,0,0.5);
  }

  .login-logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }
  .login-logo {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 10px;
  }
  .login-sub {
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .login-divider {
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    margin: 14px auto 0;
    opacity: 0.5;
  }

  .login-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .login-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.12);
  }

  .login-box button {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    padding: 14px;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    letter-spacing: 0.01em;
  }
  .login-box button:hover { opacity: .88; }
  .login-box button:active { transform: scale(0.98); }

  .login-err {
    color: var(--red);
    font-size: 0.82rem;
    margin-top: 12px;
    display: none;
    font-weight: 500;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15%  { transform: translateX(-8px); }
    30%  { transform: translateX(7px); }
    45%  { transform: translateX(-6px); }
    60%  { transform: translateX(5px); }
    75%  { transform: translateX(-3px); }
    90%  { transform: translateX(2px); }
  }
  .login-box.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97); }

  /* ─────────────────── LAYOUT ─────────────────── */
  #admin-screen { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: rgba(22, 22, 26, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: livePulse 2s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,184,148,0.5); }
    50%       { opacity: 0.85; box-shadow: 0 0 0 5px rgba(0,184,148,0); }
  }

  .topbar-right { display: flex; gap: 8px; align-items: center; }

  .topbar-meta {
    font-size: 0.72rem;
    color: var(--muted);
    padding: 0 8px;
    white-space: nowrap;
  }

  .auto-refresh-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .auto-icon {
    display: inline-block;
    transition: transform 0.4s ease;
  }
  .auto-icon.spinning {
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .topbar-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 13px;
    color: var(--muted);
    font-size: 0.78rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
    white-space: nowrap;
  }
  .topbar-btn:hover { color: var(--text); border-color: var(--accent); }
  .topbar-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(124,106,247,0.1); }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 13px;
    color: var(--muted);
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .logout-btn:hover { color: var(--red); border-color: rgba(225, 112, 85, 0.4); }

  .content { padding: 28px; max-width: 1200px; margin: 0 auto; }

  /* ─────────────────── STATS ─────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    transition: border-color .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .stat-card:hover { transform: translateY(-1px); }
  .stat-card.accent-left { border-left-color: var(--accent); }
  .stat-card.green-left  { border-left-color: var(--green); }
  .stat-card.pink-left   { border-left-color: var(--accent2); }
  .stat-card.yellow-left { border-left-color: var(--yellow); }

  .stat-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .stat-icon { font-size: 1.2rem; }
  .stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 600;
  }
  .stat-value {
    font-size: 2rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.green  { color: var(--green); }
  .stat-value.pink   { color: var(--accent2); }
  .stat-value.yellow { color: var(--yellow); }

  /* ─────────────────── USERS TABLE ─────────────────── */
  #users-section { display: none; margin-bottom: 32px; }

  .users-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .users-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  .users-table th {
    background: var(--surface2);
    padding: 11px 16px;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .users-table td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }
  .users-table tr:last-child td { border-bottom: none; }
  .users-table tr:hover td { background: rgba(255,255,255,0.02); }

  .user-del-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    color: var(--muted);
    font-size: 0.7rem;
    font-family: inherit;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .user-del-btn:hover { color: var(--red); border-color: rgba(225,112,85,0.4); }

  .user-pw-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    color: var(--muted);
    font-size: 0.7rem;
    font-family: inherit;
    cursor: pointer;
    transition: color .2s, border-color .2s;
    margin-right: 4px;
  }
  .user-pw-btn:hover { color: var(--yellow); border-color: rgba(253,203,110,0.4); }

  /* ─────────────────── CREATE USER FORM ─────────────────── */
  .create-user-form {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    display: none;
  }
  .create-user-form.visible { display: block; }

  .create-form-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .create-form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
    margin-bottom: 12px;
  }

  .create-form-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
    min-width: 140px;
  }
  .create-form-field label {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .create-form-field input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 0.85rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    width: 100%;
  }
  .create-form-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,247,0.1);
  }
  .create-form-field input::placeholder { color: var(--muted); }

  .create-form-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .create-submit-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .create-submit-btn:hover { opacity: .88; }
  .create-submit-btn:active { transform: scale(0.97); }
  .create-submit-btn:disabled { opacity: .45; cursor: not-allowed; }

  .create-cancel-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    color: var(--muted);
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .create-cancel-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  .create-form-msg {
    font-size: 0.78rem;
    font-weight: 500;
    padding: 2px 0;
    display: none;
  }
  .create-form-msg.error { color: var(--red); }
  .create-form-msg.success { color: var(--green); }

  /* ─────────────────── SESSIONS ─────────────────── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .section-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
  }

  .search-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 0.85rem;
    font-family: inherit;
    outline: none;
    width: 260px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-bar:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,247,0.1);
  }
  .search-bar::placeholder { color: var(--muted); }

  .sessions-list { display: flex; flex-direction: column; gap: 8px; }

  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .session-card:hover { border-color: rgba(124,106,247,0.4); }

  .session-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
  }

  /* Status dot */
  .session-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .session-dot.live {
    background: var(--green);
    animation: livePulse 2s ease-in-out infinite;
  }

  .session-meta { flex: 1; min-width: 0; }
  .session-preview {
    font-size: 0.88rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  .session-info {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .session-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

  .badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 0.68rem;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .badge.quiz     { border-color: rgba(124,106,247,0.4); color: var(--accent); background: rgba(124,106,247,0.08); }
  .badge.ip       { border-color: rgba(0,184,148,0.3); color: var(--green); background: rgba(0,184,148,0.07); }
  .badge.ua       { border-color: rgba(232,67,147,0.3); color: var(--accent2); background: rgba(232,67,147,0.07); }
  .badge.username { border-color: rgba(124,106,247,0.4); color: var(--accent); background: rgba(124,106,247,0.1); }

  .del-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    color: var(--muted);
    font-size: 0.7rem;
    font-family: inherit;
    cursor: pointer;
    transition: color .2s, border-color .2s;
    white-space: nowrap;
  }
  .del-btn:hover { color: var(--red); border-color: rgba(225,112,85,0.4); }

  .export-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    color: var(--muted);
    font-size: 0.7rem;
    font-family: inherit;
    cursor: pointer;
    transition: color .2s, border-color .2s;
    white-space: nowrap;
  }
  .export-btn:hover { color: var(--accent); border-color: rgba(124,106,247,0.4); }

  .chevron {
    color: var(--muted);
    font-size: 0.65rem;
    transition: transform .25s ease;
    flex-shrink: 0;
    margin-left: 2px;
  }
  .session-card.open .chevron { transform: rotate(180deg); }

  /* Expand/collapse via max-height transition */
  .session-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid transparent;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, border-color 0.2s ease, padding 0.25s ease;
    padding: 0 16px;
  }
  .session-card.open .session-body {
    border-top-color: var(--border);
    max-height: 4000px;
    padding: 16px 16px;
  }

  /* Quiz context pills */
  .quiz-ctx-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }
  .quiz-pill {
    background: rgba(124,106,247,0.1);
    border: 1px solid rgba(124,106,247,0.25);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 500;
  }
  .quiz-pill-key { opacity: 0.65; margin-right: 3px; }

  /* ─── Chat Bubbles ─── */
  .messages-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
    position: relative;
  }
  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.assistant {
    align-self: flex-start;
    align-items: flex-start;
  }

  .msg-bubble {
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 0.86rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    cursor: default;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  /* Copy button on bubble */
  .msg-copy {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.35);
    border: none;
    border-radius: 5px;
    padding: 2px 6px;
    color: rgba(255,255,255,0.75);
    font-size: 0.62rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
    font-family: inherit;
  }
  .msg.assistant .msg-copy {
    color: var(--muted);
    background: rgba(124,106,247,0.1);
    border: 1px solid var(--border);
  }
  .msg-bubble:hover .msg-copy { opacity: 1; }
  .msg-copy:hover { background: rgba(0,0,0,0.55) !important; color: #fff !important; }

  .msg-ts {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 3px;
    padding: 0 4px;
  }

  /* ─────────────────── MISC ─────────────────── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .empty-state .icon { font-size: 2.4rem; margin-bottom: 12px; }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 500;
  }

  /* ─────────────────── MOBILE ─────────────────── */
  @media (max-width: 640px) {
    .content { padding: 16px; }
    .topbar { padding: 0 14px; }
    .topbar-meta { display: none; }
    .auto-refresh-indicator { display: none; }
    .search-bar { width: 100%; }
    .section-header { flex-direction: column; align-items: stretch; }
    .stat-value { font-size: 1.7rem; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .login-box { padding: 36px 24px; }
    .session-badges { display: none; }
  }
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-blob"></div>
  <div class="login-blob-2"></div>
  <div class="login-box" id="login-box">
    <div class="login-logo-wrap">
      <div class="login-logo">0x</div>
      <div class="login-sub">Shugi AI Admin</div>
      <div class="login-divider"></div>
    </div>
    <input type="text" id="user-input" placeholder="Username" autocomplete="username">
    <input type="password" id="pass-input" placeholder="Enter password…" autocomplete="current-password">
    <button onclick="doLogin()">Enter →</button>
    <div class="login-err" id="login-err">⚠ Wrong password</div>
  </div>
</div>

<!-- ── Admin ── -->
<div id="admin-screen">
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand">0x / shugi ai</span>
      <div class="live-indicator">
        <div class="live-dot"></div>
        live
      </div>
    </div>
    <div class="topbar-right">
      <div class="auto-refresh-indicator">
        <span class="auto-icon" id="auto-icon">↻</span>
        <span>auto</span>
      </div>
      <span class="topbar-meta" id="last-refreshed">–</span>
      <button class="topbar-btn" id="users-tab-btn" onclick="toggleUsersTab()">👤 Users</button>
      <button class="topbar-btn" onclick="manualRefresh()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card accent-left">
        <div class="stat-card-header">
          <span class="stat-label">Total Sessions</span>
          <span class="stat-icon">🗂️</span>
        </div>
        <div class="stat-value accent" id="s-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-header">
          <span class="stat-label">Total Messages</span>
          <span class="stat-icon">💬</span>
        </div>
        <div class="stat-value" id="s-msgs">—</div>
      </div>
      <div class="stat-card green-left">
        <div class="stat-card-header">
          <span class="stat-label">Sessions Today</span>
          <span class="stat-icon">📅</span>
        </div>
        <div class="stat-value green" id="s-today">—</div>
      </div>
      <div class="stat-card pink-left">
        <div class="stat-card-header">
          <span class="stat-label">Messages Today</span>
          <span class="stat-icon">✨</span>
        </div>
        <div class="stat-value pink" id="s-msgs-today">—</div>
      </div>
      <div class="stat-card yellow-left">
        <div class="stat-card-header">
          <span class="stat-label">Active Today</span>
          <span class="stat-icon">🟢</span>
        </div>
        <div class="stat-value yellow" id="s-active">—</div>
      </div>
      <div class="stat-card pink-left">
        <div class="stat-card-header">
          <span class="stat-label">Users</span>
          <span class="stat-icon">👤</span>
        </div>
        <div class="stat-value pink" id="s-users">—</div>
      </div>
    </div>

    <!-- Users section (hidden by default) -->
    <div id="users-section">
      <div class="section-header">
        <div class="section-title">Users</div>
        <button class="topbar-btn" onclick="toggleCreateForm()">+ Create Account</button>
      </div>

      <!-- Inline create-account form -->
      <div class="create-user-form" id="create-user-form">
        <div class="create-form-title">New Account</div>
        <div class="create-form-row">
          <div class="create-form-field">
            <label for="cu-username">Username</label>
            <input type="text" id="cu-username" placeholder="username" autocomplete="off">
          </div>
          <div class="create-form-field">
            <label for="cu-password">Password</label>
            <input type="password" id="cu-password" placeholder="password" autocomplete="new-password">
          </div>
          <div class="create-form-field">
            <label for="cu-email">Email <span style="opacity:.5;font-weight:400;text-transform:none">(optional)</span></label>
            <input type="email" id="cu-email" placeholder="user@example.com" autocomplete="off">
          </div>
        </div>
        <div class="create-form-actions">
          <button class="create-submit-btn" id="cu-submit" onclick="createUser()">Create</button>
          <button class="create-cancel-btn" onclick="toggleCreateForm()">Cancel</button>
          <span class="create-form-msg" id="cu-msg"></span>
        </div>
      </div>

      <div class="users-table-wrap">
        <div id="users-list"><div class="loading">Loading…</div></div>
      </div>
    </div>

    <!-- Sessions -->
    <div class="section-header">
      <div class="section-title">Conversations</div>
      <input class="search-bar" type="text" id="search-input"
             placeholder="Search by message or ID…" oninput="filterSessions()">
    </div>
    <div class="sessions-list" id="sessions-list">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<script>
  const API = '';
  let TOKEN = '';
  let ALL_SESSIONS = [];
  let autoRefreshTimer = null;
  const AUTO_REFRESH_INTERVAL = 30000;

  // ── Session storage restore ────────────────────────────────────────────────
  (function() {
    const saved = sessionStorage.getItem('sage_admin_token');
    if (saved) {
      TOKEN = saved;
      fetch(`${API}/api/auth/me`, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
        .then(r => r.ok ? r.json() : null)
        .then(u => {
          if (u && u.role === 'admin') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-screen').style.display = 'block';
            loadAll();
            startAutoRefresh();
          } else {
            sessionStorage.removeItem('sage_admin_token');
            TOKEN = '';
          }
        });
    }
  })();

  // ── Login ──────────────────────────────────────────────────────────────────
  document.getElementById('pass-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const username = document.getElementById('user-input').value.trim();
    const pw = document.getElementById('pass-input').value;
    if (!username || !pw) return;

    const r = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password: pw })
    });

    if (!r.ok) {
      const errEl = document.getElementById('login-err');
      errEl.textContent = '⚠ Invalid credentials';
      errEl.style.display = 'block';
      const box = document.getElementById('login-box');
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 600);
      return;
    }

    const data = await r.json();
    if (data.user.role !== 'admin') {
      const errEl = document.getElementById('login-err');
      errEl.textContent = '⚠ Not an admin account';
      errEl.style.display = 'block';
      const box = document.getElementById('login-box');
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 600);
      return;
    }

    TOKEN = data.token;
    sessionStorage.setItem('sage_admin_token', TOKEN);
    sessionStorage.setItem('sage_admin_user', data.user.username);

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('login-err').style.display = 'none';
    loadAll();
    startAutoRefresh();
  }

  function logout() {
    fetch(`${API}/api/auth/logout`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN } });
    sessionStorage.removeItem('sage_admin_token');
    sessionStorage.removeItem('sage_admin_user');
    TOKEN = '';
    ALL_SESSIONS = [];
    clearAutoRefresh();
    document.getElementById('user-input').value = '';
    document.getElementById('pass-input').value = '';
    document.getElementById('login-err').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  // ── Users tab ─────────────────────────────────────────────────────────────
  let usersTabOpen = false;

  function toggleUsersTab() {
    usersTabOpen = !usersTabOpen;
    const section = document.getElementById('users-section');
    const btn = document.getElementById('users-tab-btn');
    if (usersTabOpen) {
      section.style.display = 'block';
      btn.classList.add('active');
      loadUsers();
    } else {
      section.style.display = 'none';
      btn.classList.remove('active');
    }
  }

  async function loadUsers() {
    const el = document.getElementById('users-list');
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      const r = await fetch(`${API}/0x/api/users`, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
      const users = await r.json();
      if (!users.length) {
        el.innerHTML = '<div class="empty-state"><div class="icon">👤</div>No users yet</div>';
        return;
      }
      const rows = users.map(u => `
        <tr>
          <td>${escHtml(u.username)}</td>
          <td>${escHtml(u.email || '—')}</td>
          <td>${u.session_count ?? '—'}</td>
          <td>${u.message_count ?? '—'}</td>
          <td>${u.created_at ? absoluteDate(u.created_at) : '—'}</td>
          <td style="white-space:nowrap">
            <button class="user-pw-btn" onclick="resetUserPassword(${u.id}, '${escHtml(u.username)}')">Reset PW</button>
            <button class="user-del-btn" onclick="deleteUser(${u.id}, '${escHtml(u.username)}')">Delete</button>
          </td>
        </tr>`).join('');
      el.innerHTML = `
        <table class="users-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th>Sessions</th>
              <th>Messages</th>
              <th>Joined</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch(e) {
      el.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>Failed to load users</div>';
    }
  }

  async function deleteUser(id, username) {
    if (!confirm(`Delete user "${username}"?`)) return;
    await fetch(`${API}/0x/api/users/${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    loadUsers();
  }

  async function resetUserPassword(id, username) {
    const newPass = prompt(`New password for "${username}":`);
    if (!newPass) return;
    const r = await fetch(`${API}/0x/api/users/${encodeURIComponent(id)}/password`, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: newPass })
    });
    if (r.ok) {
      alert(`Password reset for "${username}". All sessions revoked.`);
    } else {
      const err = await r.json().catch(() => ({}));
      alert(`Failed to reset password: ${err.error || r.status}`);
    }
  }

  // ── Create user form ───────────────────────────────────────────────────────
  let createFormOpen = false;

  function toggleCreateForm() {
    createFormOpen = !createFormOpen;
    const form = document.getElementById('create-user-form');
    if (createFormOpen) {
      form.classList.add('visible');
      document.getElementById('cu-username').focus();
    } else {
      form.classList.remove('visible');
      document.getElementById('cu-username').value = '';
      document.getElementById('cu-password').value = '';
      document.getElementById('cu-email').value = '';
      const msg = document.getElementById('cu-msg');
      msg.style.display = 'none';
      msg.textContent = '';
    }
  }

  async function createUser() {
    const username = document.getElementById('cu-username').value.trim();
    const password = document.getElementById('cu-password').value;
    const email    = document.getElementById('cu-email').value.trim();
    const msg      = document.getElementById('cu-msg');
    const btn      = document.getElementById('cu-submit');

    msg.style.display = 'none';
    msg.className = 'create-form-msg';

    if (!username || !password) {
      msg.textContent = 'Username and password are required.';
      msg.classList.add('error');
      msg.style.display = 'inline';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating…';

    const body = { username, password };
    if (email) body.email = email;

    try {
      const r = await fetch(`${API}/0x/api/users`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await r.json();
      if (!r.ok) {
        msg.textContent = data.error || `Error ${r.status}`;
        msg.classList.add('error');
        msg.style.display = 'inline';
      } else {
        // Success: close form, show brief flash, reload list
        toggleCreateForm();
        // Brief success toast above the table
        const el = document.getElementById('users-list');
        const toast = document.createElement('div');
        toast.className = 'create-form-msg success';
        toast.style.cssText = 'display:block;padding:8px 0;font-size:.82rem';
        toast.textContent = `Account "${data.username}" created.`;
        el.parentElement.insertBefore(toast, el);
        setTimeout(() => toast.remove(), 3000);
        loadUsers();
      }
    } catch(e) {
      msg.textContent = 'Network error — try again.';
      msg.classList.add('error');
      msg.style.display = 'inline';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create';
    }
  }

  // ── Auto-refresh ──────────────────────────────────────────────────────────
  function startAutoRefresh() {
    clearAutoRefresh();
    autoRefreshTimer = setInterval(() => silentRefresh(), AUTO_REFRESH_INTERVAL);
  }
  function clearAutoRefresh() {
    if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  }

  async function silentRefresh() {
    const icon = document.getElementById('auto-icon');
    icon.classList.add('spinning');
    await loadAll();
    icon.classList.remove('spinning');
  }

  async function manualRefresh() {
    const icon = document.getElementById('auto-icon');
    icon.classList.add('spinning');
    await loadAll();
    icon.classList.remove('spinning');
    startAutoRefresh(); // reset timer
  }

  function updateRefreshedTs() {
    const el = document.getElementById('last-refreshed');
    const now = new Date();
    el.textContent = 'Refreshed ' + now.toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // ── Load ───────────────────────────────────────────────────────────────────
  async function loadAll() {
    await Promise.all([loadStats(), loadSessions()]);
    updateRefreshedTs();
  }

  async function loadStats() {
    try {
      const r = await fetch(`${API}/0x/api/stats`, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
      const d = await r.json();
      animateCount('s-total',      d.total_sessions);
      animateCount('s-msgs',       d.total_messages);
      animateCount('s-today',      d.sessions_today);
      animateCount('s-msgs-today', d.messages_today);
      animateCount('s-active',     d.active_today);
      animateCount('s-users',      d.total_users);
    } catch(e) { console.error(e); }
  }

  async function loadSessions() {
    // Only show skeleton on first load (when list is truly empty / loading)
    const el = document.getElementById('sessions-list');
    if (el.innerHTML.includes('Loading') || el.innerHTML.includes('empty-state')) {
      el.innerHTML = '<div class="loading">Loading…</div>';
    }
    try {
      const r = await fetch(`${API}/0x/api/sessions`, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
      ALL_SESSIONS = await r.json();
      filterSessions();
    } catch(e) {
      el.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>Failed to load sessions</div>';
    }
  }

  // ── Count-up animation ────────────────────────────────────────────────────
  function animateCount(id, target) {
    const el = document.getElementById(id);
    if (!el) return;
    if (target === undefined || target === null) return;
    const prev = parseInt(el.textContent) || 0;
    if (prev === target) return;
    const diff = target - prev;
    const duration = 600;
    const steps = 24;
    let step = 0;
    const interval = setInterval(() => {
      step++;
      const progress = step / steps;
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(prev + diff * eased);
      if (step >= steps) {
        el.textContent = target;
        clearInterval(interval);
      }
    }, duration / steps);
  }

  // ── Filter + Render ───────────────────────────────────────────────────────
  function filterSessions() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    if (!q) return renderSessions(ALL_SESSIONS);
    const filtered = ALL_SESSIONS.filter(s => {
      const first = (s.first_msg || '').toLowerCase();
      const id = (s.id || '').toLowerCase();
      // Also search messages if available in cached data
      return first.includes(q) || id.includes(q);
    });
    renderSessions(filtered);
  }

  function renderSessions(sessions) {
    const el = document.getElementById('sessions-list');
    if (!sessions.length) {
      el.innerHTML = '<div class="empty-state"><div class="icon">💬</div>No conversations yet</div>';
      return;
    }
    el.innerHTML = sessions.map(s => sessionCard(s)).join('');
  }

  // ── Relative timestamps ───────────────────────────────────────────────────
  function relativeTime(ts) {
    const now = Date.now() / 1000;
    const diff = now - ts;
    if (diff < 60)          return 'just now';
    if (diff < 3600)        return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400)       return `${Math.floor(diff / 3600)}h ago`;
    if (diff < 172800)      return 'yesterday';
    if (diff < 604800)      return `${Math.floor(diff / 86400)} days ago`;
    const d = new Date(ts * 1000);
    return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
  }

  function absoluteDate(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleString('en-CA', { month: 'short', day: 'numeric',
      year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function isLive(ts) {
    return (Date.now() / 1000 - ts) < 300;
  }

  // ── Browser name from UA ──────────────────────────────────────────────────
  function parseBrowser(ua) {
    if (!ua) return null;
    const u = ua.toLowerCase();
    if (u.includes('mobile') || u.includes('android') || u.includes('iphone')) return 'Mobile';
    if (u.includes('firefox')) return 'Firefox';
    if (u.includes('edg'))     return 'Edge';
    if (u.includes('chrome'))  return 'Chrome';
    if (u.includes('safari'))  return 'Safari';
    return 'Browser';
  }

  // ── Session Card ──────────────────────────────────────────────────────────
  function sessionCard(s) {
    const preview = s.first_msg ? escHtml(s.first_msg.slice(0, 100)) : '(empty)';
    const relTs = relativeTime(s.updated_at);
    const absTs = absoluteDate(s.updated_at);
    const live = isLive(s.updated_at);
    const hasQuiz = s.quiz_ctx && Object.keys(s.quiz_ctx).length > 0;
    const browser = parseBrowser(s.user_agent);
    const dotClass = live ? 'session-dot live' : 'session-dot';

    return `
      <div class="session-card" id="card-${s.id}">
        <div class="session-header" onclick="toggleCard('${s.id}')">
          <div class="${dotClass}"></div>
          <div class="session-meta">
            <div class="session-preview">${preview}</div>
            <div class="session-info">
              <span title="${escHtml(absTs)}">${escHtml(relTs)}</span>
              <span>·</span>
              <span>${s.msg_count} msg${s.msg_count !== 1 ? 's' : ''}</span>
              <span>·</span>
              <span style="font-family:monospace;font-size:0.68rem">${escHtml(s.id.slice(0,8))}…</span>
            </div>
          </div>
          <div class="session-badges">
            ${hasQuiz ? '<span class="badge quiz">quiz ctx</span>' : ''}
            ${s.username ? `<span class="badge username">@${escHtml(s.username)}</span>` : ''}
            ${s.ip ? `<span class="badge ip" title="${escHtml(s.ip)}">${escHtml(s.ip.split(',')[0].trim())}</span>` : ''}
            ${browser ? `<span class="badge ua">${escHtml(browser)}</span>` : ''}
            <button class="export-btn" onclick="exportSession(event,'${s.id}')">Export</button>
            <button class="del-btn" onclick="deleteSession(event,'${s.id}')">Delete</button>
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="session-body" id="body-${s.id}">
          <div class="loading" id="msgs-${s.id}">Loading…</div>
        </div>
      </div>`;
  }

  // ── Toggle card ───────────────────────────────────────────────────────────
  async function toggleCard(id) {
    const card = document.getElementById(`card-${id}`);
    const isOpen = card.classList.contains('open');
    card.classList.toggle('open', !isOpen);
    if (!isOpen) {
      loadConversation(id);
    }
  }

  // ── Load conversation ─────────────────────────────────────────────────────
  async function loadConversation(id) {
    const el = document.getElementById(`msgs-${id}`);
    try {
      const r = await fetch(`${API}/0x/api/conversation/${id}`, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
      const d = await r.json();

      let html = '';

      // Quiz context as pill strip
      if (d.session && d.session.quiz_ctx && Object.keys(d.session.quiz_ctx).length) {
        const pills = Object.entries(d.session.quiz_ctx)
          .map(([k,v]) => `<span class="quiz-pill"><span class="quiz-pill-key">${escHtml(k)}</span>${escHtml(String(v))}</span>`)
          .join('');
        html += `<div class="quiz-ctx-pills">${pills}</div>`;
      }

      // Messages as chat bubbles
      if (!d.messages || !d.messages.length) {
        html += '<div style="color:var(--muted);font-size:.85rem;padding:8px 0">No messages</div>';
      } else {
        html += '<div class="messages-wrap">';
        html += d.messages.map(m => {
          const role = m.role === 'user' ? 'user' : 'assistant';
          const ts = absoluteDate(m.ts);
          const msgId = `msg-${id}-${m.ts}-${Math.random().toString(36).slice(2,6)}`;
          return `
            <div class="msg ${role}">
              <div class="msg-bubble" id="${msgId}">
                ${escHtml(m.content)}
                <button class="msg-copy" onclick="copyMsg('${msgId}')">copy</button>
              </div>
              <div class="msg-ts">${escHtml(ts)}</div>
            </div>`;
        }).join('');
        html += '</div>';
      }

      // Store conversation data for export
      el.closest('.session-body').dataset.convo = JSON.stringify(d);
      el.outerHTML = html;

    } catch(e) {
      el.textContent = 'Failed to load.';
    }
  }

  // ── Copy message ──────────────────────────────────────────────────────────
  function copyMsg(id) {
    const el = document.getElementById(id);
    if (!el) return;
    // Get text content without the copy button text
    const btn = el.querySelector('.msg-copy');
    const text = (btn ? el.textContent.replace(btn.textContent, '') : el.textContent).trim();
    navigator.clipboard.writeText(text).then(() => {
      const btn = el.querySelector('.msg-copy');
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => btn.textContent = orig, 1200);
      }
    });
  }

  // ── Export session ────────────────────────────────────────────────────────
  async function exportSession(e, id) {
    e.stopPropagation();
    // Load if needed
    let data;
    const body = document.getElementById(`body-${id}`);
    if (body && body.dataset.convo) {
      data = JSON.parse(body.dataset.convo);
    } else {
      try {
        const r = await fetch(`${API}/0x/api/conversation/${id}`, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
        data = await r.json();
      } catch(err) { alert('Failed to load session for export.'); return; }
    }

    let txt = `=== Session ${id} ===\n`;
    if (data.session) {
      txt += `Updated: ${absoluteDate(data.session.updated_at)}\n`;
      if (data.session.quiz_ctx && Object.keys(data.session.quiz_ctx).length) {
        txt += `Quiz context: ${JSON.stringify(data.session.quiz_ctx)}\n`;
      }
    }
    txt += `\n`;
    (data.messages || []).forEach(m => {
      txt += `[${m.role.toUpperCase()}] ${absoluteDate(m.ts)}\n${m.content}\n\n`;
    });

    const blob = new Blob([txt], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `session-${id.slice(0,8)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Delete session ────────────────────────────────────────────────────────
  async function deleteSession(e, id) {
    e.stopPropagation();
    if (!confirm('Delete this conversation?')) return;
    await fetch(`${API}/0x/api/conversation/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    ALL_SESSIONS = ALL_SESSIONS.filter(s => s.id !== id);
    filterSessions();
    loadStats();
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
