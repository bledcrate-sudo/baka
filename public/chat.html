<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shugi AI — Mental Health Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

/* ── Tokens (Refined × Shugi) ── */
:root {
  --bg:           #06060f;
  --surface:      rgba(255,255,255,0.035);
  --surface-2:    rgba(255,255,255,0.06);
  --border:       rgba(255,255,255,0.08);
  --border-focus: rgba(124,106,247,0.5);
  --primary:      #7c6af7;
  --primary-dim:  rgba(124,106,247,0.18);
  --primary-glow: rgba(124,106,247,0.35);
  --text:         #f0eeff;
  --muted:        rgba(240,238,255,0.45);
  --muted-2:      rgba(240,238,255,0.25);
  --danger:       #f87171;
  --success:      #34d399;
  --r-sm:         10px;
  --r-md:         16px;
  --r-lg:         24px;
  --r-xl:         32px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body:    'Inter', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
  --ease-spring:  cubic-bezier(.34,1.56,.64,1);
  --ease-smooth:  cubic-bezier(.25,.1,.25,1);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Animated orb background ── */
.orbs {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.55;
  animation: drift 20s ease-in-out infinite;
}
.orb-1 {
  width: 520px; height: 520px;
  background: radial-gradient(circle, #5b3ef5 0%, transparent 70%);
  top: -120px; left: -100px;
  animation-duration: 22s;
}
.orb-2 {
  width: 420px; height: 420px;
  background: radial-gradient(circle, #9b3ef5 0%, transparent 70%);
  bottom: -80px; right: -80px;
  animation-duration: 18s;
  animation-delay: -7s;
}
.orb-3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, #3b5bf5 0%, transparent 70%);
  top: 40%; left: 55%;
  animation-duration: 26s;
  animation-delay: -13s;
  opacity: 0.3;
}
.orb-4 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, #f53b8e 0%, transparent 70%);
  top: 10%; right: 20%;
  animation-duration: 30s;
  animation-delay: -4s;
  opacity: 0.18;
}
@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25%       { transform: translate(30px, -40px) scale(1.05); }
  50%       { transform: translate(-20px, 30px) scale(0.97); }
  75%       { transform: translate(40px, 20px) scale(1.03); }
}

/* floating particles */
.particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.particle {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: rgba(124,106,247,0.6);
  animation: float-up linear infinite;
}
@keyframes float-up {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-10px) scale(1); opacity: 0; }
}

/* ── Screen base ── */
.screen { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
.screen.hidden { display: none; }

/* ══════════════════════════════════
   AUTH SCREEN
══════════════════════════════════ */
#auth-screen {
  background: transparent;
  padding: 20px;
}

.auth-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(32px) saturate(140%);
  -webkit-backdrop-filter: blur(32px) saturate(140%);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 48px 40px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,106,247,0.08) inset;
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 280px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(124,106,247,0.6), transparent);
}

.auth-logo-wrap {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.auth-logo {
  width: 60px; height: 60px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(124,106,247,0.25), rgba(162,89,255,0.15));
  border: 1px solid rgba(124,106,247,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  box-shadow: 0 8px 32px rgba(124,106,247,0.25);
  animation: logo-pulse 3s ease-in-out infinite;
}
@keyframes logo-pulse {
  0%, 100% { box-shadow: 0 8px 32px rgba(124,106,247,0.25); }
  50%       { box-shadow: 0 8px 48px rgba(124,106,247,0.5); }
}

.auth-title {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 600;
  text-align: center;
  background: linear-gradient(135deg, #fff 0%, #c4b5fd 60%, #a78bfa 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.auth-sub {
  text-align: center;
  color: var(--muted);
  font-size: 0.82rem;
  letter-spacing: 0.5px;
  margin-bottom: 32px;
}

/* Tabs */
.auth-tabs {
  display: flex;
  background: rgba(255,255,255,0.04);
  border-radius: var(--r-sm);
  padding: 3px;
  gap: 2px;
  margin-bottom: 28px;
  border: 1px solid var(--border);
}
.auth-tab {
  flex: 1;
  padding: 9px 0;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 500;
  border-radius: 7px;
  cursor: pointer;
  transition: background .2s, color .2s;
}
.auth-tab.active {
  background: rgba(124,106,247,0.2);
  color: #c4b5fd;
  border: 1px solid rgba(124,106,247,0.25);
}

/* Fields */
.field {
  margin-bottom: 12px;
  position: relative;
}
.field input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 13px 16px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.field input::placeholder { color: var(--muted-2); }
.field input:focus {
  border-color: var(--border-focus);
  background: rgba(124,106,247,0.06);
  box-shadow: 0 0 0 3px rgba(124,106,247,0.1);
}

/* Error */
.auth-error {
  font-size: 0.8rem;
  color: var(--danger);
  min-height: 18px;
  margin-bottom: 8px;
  padding-left: 2px;
  display: none;
}
.auth-error.show { display: block; }

/* Submit button */
.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #7c6af7, #9b59f5);
  border: none;
  border-radius: var(--r-sm);
  color: #fff;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 4px 24px rgba(124,106,247,0.35);
  margin-top: 4px;
  letter-spacing: 0.2px;
}
.btn-submit:hover { opacity: 0.9; box-shadow: 0 6px 32px rgba(124,106,247,0.5); }
.btn-submit:active { transform: scale(0.98); }
.btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Shake */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-8px); }
  40%      { transform: translateX(8px); }
  60%      { transform: translateX(-5px); }
  80%      { transform: translateX(5px); }
}
.shake { animation: shake .4s var(--ease-smooth); }

/* ══════════════════════════════════
   CHAT SCREEN
══════════════════════════════════ */
#chat-screen {
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  padding: 0;
}

/* Header */
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: rgba(6,6,15,0.7);
  backdrop-filter: blur(24px) saturate(120%);
  -webkit-backdrop-filter: blur(24px) saturate(120%);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.chat-header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(124,106,247,0.4), transparent);
}

.header-left { display: flex; align-items: center; gap: 14px; }
.chat-avatar-hd {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(124,106,247,0.3), rgba(162,89,255,0.2));
  border: 1px solid rgba(124,106,247,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.chat-brand { line-height: 1.2; }
.chat-brand-name {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
  background: linear-gradient(90deg, #c4b5fd, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.chat-brand-status {
  font-size: 0.72rem;
  color: var(--success);
  display: flex; align-items: center; gap: 5px;
  font-weight: 500;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

.header-right { display: flex; align-items: center; gap: 12px; }
.user-chip {
  font-size: 0.78rem;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-weight: 500;
}
.btn-logout {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 0.78rem;
  padding: 6px 12px;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.btn-logout:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--surface-2); }
.btn-back-home {
  background: none; border: none;
  color: var(--muted); font-size: 0.78rem;
  cursor: pointer; padding: 6px 8px;
  transition: color .15s;
  display: flex; align-items: center; gap: 4px;
  font-family: var(--font-body);
}
.btn-back-home:hover { color: var(--text); }

/* Messages area */
.messages-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 28px 0;
  scroll-behavior: smooth;
}
.messages-wrap::-webkit-scrollbar { width: 4px; }
.messages-wrap::-webkit-scrollbar-track { background: transparent; }
.messages-wrap::-webkit-scrollbar-thumb { background: rgba(124,106,247,0.25); border-radius: 2px; }

.messages-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Date divider */
.date-divider {
  text-align: center;
  font-size: 0.72rem;
  color: var(--muted-2);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  position: relative;
  margin: 4px 0;
}
.date-divider::before, .date-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background: var(--border);
}
.date-divider::before { left: 0; }
.date-divider::after { right: 0; }

/* Messages */
.msg { display: flex; align-items: flex-start; gap: 10px; animation: msg-in .3s var(--ease-spring); }
@keyframes msg-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-ai { flex-direction: row; }
.msg-user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(124,106,247,0.25), rgba(162,89,255,0.15));
  border: 1px solid rgba(124,106,247,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.msg-bubble {
  max-width: 75%;
  padding: 13px 18px;
  border-radius: 18px;
  font-size: 0.9rem;
  line-height: 1.65;
  position: relative;
}
.msg-ai .msg-bubble {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.07);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.msg-user .msg-bubble {
  background: linear-gradient(135deg, #6d5ce7, #8b5cf6);
  border-bottom-right-radius: 4px;
  color: #fff;
  box-shadow: 0 4px 20px rgba(109,92,231,0.3);
}

/* Markdown in AI messages */
.msg-bubble strong { font-weight: 600; color: #c4b5fd; }
.msg-bubble em { font-style: italic; color: var(--muted); }
.msg-bubble code {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  background: rgba(124,106,247,0.12);
  padding: 1px 6px;
  border-radius: 4px;
  color: #c4b5fd;
}

/* Typing indicator */
.typing-row { display: flex; align-items: flex-end; gap: 10px; padding-bottom: 4px; }
.typing-bubble {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 18px; border-bottom-left-radius: 4px;
  padding: 13px 18px;
  display: flex; gap: 5px; align-items: center;
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(124,106,247,0.6);
  animation: bounce-dot .9s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: .15s; }
.typing-dot:nth-child(3) { animation-delay: .3s; }
@keyframes bounce-dot {
  0%,60%,100% { transform: translateY(0); opacity: 0.5; }
  30%          { transform: translateY(-6px); opacity: 1; }
}

/* Input area */
.chat-input-wrap {
  background: rgba(6,6,15,0.75);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  padding: 16px 20px 20px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.chat-input-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 10px 10px 10px 18px;
  transition: border-color .2s, box-shadow .2s;
}
.chat-input-inner:focus-within {
  border-color: rgba(124,106,247,0.4);
  box-shadow: 0 0 0 3px rgba(124,106,247,0.08);
}
.chat-input-inner textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9rem;
  line-height: 1.55;
  resize: none;
  max-height: 160px;
  overflow-y: auto;
  padding: 4px 0;
}
.chat-input-inner textarea::placeholder { color: var(--muted-2); }
.chat-input-inner textarea::-webkit-scrollbar { width: 3px; }
.chat-input-inner textarea::-webkit-scrollbar-thumb { background: rgba(124,106,247,0.25); border-radius: 2px; }

.btn-send {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #7c6af7, #9b59f5);
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity .15s, transform .15s, box-shadow .2s;
  box-shadow: 0 2px 12px rgba(124,106,247,0.3);
}
.btn-send:hover { opacity: 0.85; box-shadow: 0 4px 20px rgba(124,106,247,0.5); }
.btn-send:active { transform: scale(0.93); }
.btn-send:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-send svg { width: 17px; height: 17px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.chat-disclaimer {
  max-width: 720px;
  margin: 8px auto 0;
  font-size: 0.7rem;
  color: var(--muted-2);
  text-align: center;
  letter-spacing: 0.2px;
}

/* Welcome state */
.welcome-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  padding: 40px 20px;
  text-align: center;
  opacity: 0.7;
}
.welcome-state .w-icon { font-size: 40px; margin-bottom: 8px; }
.welcome-state h2 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 500;
  color: var(--text);
  font-style: italic;
}
.welcome-state p { font-size: 0.85rem; color: var(--muted); max-width: 320px; line-height: 1.6; }

/* Responsive */
@media (max-width: 600px) {
  .auth-card { padding: 36px 24px 32px; }
  .auth-title { font-size: 1.7rem; }
  .chat-header { padding: 12px 16px; }
  .btn-back-home span { display: none; }
  .user-chip { display: none; }
  .messages-inner { padding: 0 12px; }
  .msg-bubble { max-width: 88%; }
  .chat-input-wrap { padding: 12px 12px 16px; }
}
</style>
</head>
<body>

<!-- Animated background -->
<div class="orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>
<div class="particles" id="particles"></div>

<!-- ══════════ AUTH SCREEN ══════════ -->
<div class="screen" id="auth-screen">
  <div class="auth-card" id="auth-card">

    <h1 class="auth-title">Shugi AI</h1>
    <p class="auth-sub">Personal Mental Health Assistant</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Login -->
    <form id="form-login" onsubmit="submitAuth(event,'login')">
      <div class="field"><input type="text" id="login-user" placeholder="Username" autocomplete="username" required></div>
      <div class="field"><input type="password" id="login-pass" placeholder="Password" autocomplete="current-password" required></div>
      <div class="auth-error" id="err-login"></div>
      <button type="submit" class="btn-submit" id="btn-login">
        <span>Sign In</span>
        <div class="spinner" style="display:none"></div>
      </button>
    </form>

    <!-- Register -->
    <form id="form-register" style="display:none" onsubmit="submitAuth(event,'register')">
      <div class="field"><input type="text" id="reg-user" placeholder="Username" autocomplete="username" required></div>
      <div class="field"><input type="email" id="reg-email" placeholder="Email (optional)" autocomplete="email"></div>
      <div class="field"><input type="password" id="reg-pass" placeholder="Password (min 6 chars)" autocomplete="new-password" required minlength="6"></div>
      <div class="auth-error" id="err-register"></div>
      <button type="submit" class="btn-submit" id="btn-register">
        <span>Create Account</span>
        <div class="spinner" style="display:none"></div>
      </button>
    </form>
  </div>
</div>

<!-- ══════════ CHAT SCREEN ══════════ -->
<div class="screen hidden" id="chat-screen" style="flex-direction:column; align-items:stretch; justify-content:flex-start;">

  <!-- Header -->
  <header class="chat-header">
    <div class="header-left">
      <button class="btn-back-home" onclick="window.location.href='/'">
        ← <span>Home</span>
      </button>
      <div class="chat-avatar-hd">✨</div>
      <div class="chat-brand">
        <div class="chat-brand-name">Shugi AI</div>
        <div class="chat-brand-status"><span class="status-dot"></span> Online</div>
      </div>
    </div>
    <div class="header-right">
      <span class="user-chip" id="user-chip"></span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </header>

  <!-- Messages -->
  <div class="messages-wrap" id="messages-wrap">
    <div class="messages-inner" id="messages">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-wrap">
    <div class="chat-input-inner">
      <textarea
        id="msg-input"
        placeholder="Share what's on your mind…"
        rows="1"
        onkeydown="inputKeydown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="btn-send" id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <p class="chat-disclaimer">Shugi is an AI, not a substitute for professional therapy. In crisis, please contact a helpline.</p>
  </div>

</div>

<script>
// ── Config ──
const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? '' : 'https://api.shugiai.com';

// ── State ──
let TOKEN = localStorage.getItem('shugiToken');
let USERNAME = localStorage.getItem('shugiUsername');
let isStreaming = false;
let currentTab = 'login';

// ── Init ──
(async function init() {
  spawnParticles();
  if (TOKEN) {
    try {
      const res = await fetch(API + '/api/auth/me', { headers: { Authorization: 'Bearer ' + TOKEN } });
      if (res.ok) {
        const d = await res.json();
        USERNAME = d.username;
        showChat();
        return;
      }
    } catch {}
    TOKEN = null;
    localStorage.removeItem('shugiToken');
    localStorage.removeItem('shugiUsername');
  }
  showAuth();
})();

// ── Particles ──
function spawnParticles() {
  const wrap = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${Math.random()*100}%;
      width: ${1 + Math.random()*2}px;
      height: ${1 + Math.random()*2}px;
      animation-duration: ${8 + Math.random()*18}s;
      animation-delay: ${-Math.random()*20}s;
      opacity: ${0.2 + Math.random()*0.5};
    `;
    wrap.appendChild(p);
  }
}

// ── Screen transitions ──
function showAuth() {
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('chat-screen').classList.add('hidden');
}

function showChat() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('chat-screen').classList.remove('hidden');
  document.getElementById('user-chip').textContent = '👤 ' + USERNAME;
  const msgs = document.getElementById('messages');
  if (!msgs.children.length) {
    appendAI("Hello, I'm Shugi. I'm here to listen — without judgment, without rushing you.\n\nWhat's on your mind today?");
  }
  setTimeout(() => document.getElementById('msg-input').focus(), 300);
}

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('err-login').classList.remove('show');
  document.getElementById('err-register').classList.remove('show');
}

// ── Auth submit ──
async function submitAuth(e, mode) {
  e.preventDefault();
  const errEl = document.getElementById('err-' + mode);
  const btn = document.getElementById('btn-' + mode);
  const span = btn.querySelector('span');
  const spinner = btn.querySelector('.spinner');

  let body;
  if (mode === 'login') {
    body = { username: document.getElementById('login-user').value.trim(), password: document.getElementById('login-pass').value };
  } else {
    body = {
      username: document.getElementById('reg-user').value.trim(),
      email: document.getElementById('reg-email').value.trim() || null,
      password: document.getElementById('reg-pass').value
    };
  }

  if (!body.username || !body.password) return;

  btn.disabled = true;
  span.style.display = 'none';
  spinner.style.display = 'block';
  errEl.classList.remove('show');

  try {
    const endpoint = API + (mode === 'login' ? '/api/auth/login' : '/api/auth/register');
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      errEl.textContent = data.detail || data.error || `Error ${res.status}`;
      errEl.classList.add('show');
      const card = document.getElementById('auth-card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    } else {
      TOKEN = data.token;
      USERNAME = data.user ? data.user.username : (data.username || 'user');
      localStorage.setItem('shugiToken', TOKEN);
      localStorage.setItem('shugiUsername', USERNAME);
      showChat();
    }
  } catch(err) {
    errEl.textContent = err && err.message ? `Error: ${err.message}` : 'Connection error. Is the server running?';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    span.style.display = '';
    spinner.style.display = 'none';
  }
}

// ── Logout ──
async function logout() {
  try { await fetch(API + '/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN } }); } catch {}
  TOKEN = null; USERNAME = null;
  localStorage.removeItem('shugiToken');
  localStorage.removeItem('shugiUsername');
  document.getElementById('messages').innerHTML = '';
  showAuth();
}

// ── Message rendering ──
function sageMd(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br>');
}

function appendUser(text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<div class="msg-bubble">${sageMd(text)}</div>`;
  msgs.appendChild(div);
  scrollBottom();
}

function appendAI(text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML = `

    <div class="msg-bubble">${sageMd(text)}</div>
  `;
  msgs.appendChild(div);
  scrollBottom();
  return div.querySelector('.msg-bubble');
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'typing-row'; el.id = 'typing-row';
  el.innerHTML = `

    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  msgs.appendChild(el);
  scrollBottom();
}

function hideTyping() {
  document.getElementById('typing-row')?.remove();
}

function scrollBottom() {
  const wrap = document.getElementById('messages-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

// ── Send message ──
async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  appendUser(text);

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const res = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN
      },
      body: JSON.stringify({ message: text })
    });

    if (res.status === 401) {
      hideTyping();
      TOKEN = null; localStorage.removeItem('shugiToken'); localStorage.removeItem('shugiUsername');
      showAuth();
      return;
    }

    hideTyping();
    const bubble = appendAI('');
    bubble.innerHTML = '';

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const raw = line.slice(6);
          if (raw === '[DONE]') break;
          try {
            const d = JSON.parse(raw);
            const piece = d.token ?? d.content ?? d.text ?? '';
            if (piece) {
              fullText += piece;
              bubble.innerHTML = sageMd(fullText);
              scrollBottom();
            }
          } catch {}
        }
      }
    }
  } catch (err) {
    hideTyping();
    appendAI('Something went wrong. Please try again.');
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

// ── Input helpers ──
function inputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
</script>
</body>
</html>
