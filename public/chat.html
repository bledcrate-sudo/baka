<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shugi AI — Mental Health Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

/* ── Design Tokens ── */
:root {
  --bg:            #0a0812;
  --rose:          #e8607a;
  --lavender:      #9b8ff5;
  --teal:          #2ec4b6;
  --amber:         #f59e0b;
  --text:          #f0ecfc;
  --muted:         #7e79a0;
  --muted-2:       rgba(126,121,160,0.5);
  --danger:        #e8607a;
  --success:       #2ec4b6;
  --glass-bg:      linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  --glass-border:  rgba(255,255,255,0.08);
  --glass-shadow:  0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07);
  --glass-blur:    blur(24px);
  --r-sm:          10px;
  --r-md:          16px;
  --r-lg:          22px;
  --r-xl:          28px;
  --font-display:  'Cormorant Garamond', Georgia, serif;
  --font-body:     'Manrope', system-ui, sans-serif;
  --ease-spring:   cubic-bezier(.34,1.56,.64,1);
  --ease-smooth:   cubic-bezier(.25,.1,.25,1);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Grain texture ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 200px 200px;
  opacity: 0.028;
}

/* ── Animated orbs ── */
.orbs {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  animation: drift 20s ease-in-out infinite;
}
.orb-1 {
  width: 560px; height: 560px;
  background: rgba(232,96,122,0.18);
  top: -160px; left: -120px;
  animation-duration: 24s;
}
.orb-2 {
  width: 480px; height: 480px;
  background: rgba(155,143,245,0.15);
  bottom: -100px; right: -100px;
  animation-duration: 20s;
  animation-delay: -8s;
}
.orb-3 {
  width: 360px; height: 360px;
  background: rgba(46,196,182,0.10);
  top: 38%; left: 52%;
  animation-duration: 28s;
  animation-delay: -14s;
}
.orb-4 {
  width: 260px; height: 260px;
  background: rgba(245,158,11,0.08);
  top: 8%; right: 18%;
  animation-duration: 32s;
  animation-delay: -5s;
}
@keyframes drift {
  0%,  100% { transform: translate(0, 0) scale(1); }
  25%        { transform: translate(32px, -44px) scale(1.06); }
  50%        { transform: translate(-22px, 32px) scale(0.96); }
  75%        { transform: translate(44px, 18px) scale(1.04); }
}

/* ── Particle field ── */
.particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.particle {
  position: absolute;
  border-radius: 50%;
  background: rgba(155,143,245,0.55);
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  8%   { opacity: 1; }
  88%  { opacity: 0.35; }
  100% { transform: translateY(-20px) scale(1.2); opacity: 0; }
}

/* ── Screen base ── */
.screen { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
.screen.hidden { display: none; }

/* ══════════════════════════════════════════
   AUTH SCREEN
══════════════════════════════════════════ */
#auth-screen {
  padding: 20px;
}

.auth-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur) saturate(150%);
  -webkit-backdrop-filter: var(--glass-blur) saturate(150%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  box-shadow: var(--glass-shadow);
  padding: 52px 44px 44px;
  width: 100%;
  max-width: 428px;
  position: relative;
  overflow: hidden;
}

/* Top shimmer line */
.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 70%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  pointer-events: none;
}

/* Card inner ambient glow */
.auth-card::after {
  content: '';
  position: absolute;
  top: -60px; left: 50%;
  transform: translateX(-50%);
  width: 240px; height: 120px;
  background: radial-gradient(ellipse, rgba(155,143,245,0.12) 0%, transparent 70%);
  pointer-events: none;
}

/* Logo box */
.auth-logo-wrap {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 22px;
}
.auth-logo {
  width: 64px; height: 64px;
  border-radius: 20px;
  background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 8px 32px rgba(155,143,245,0.20), inset 0 1px 0 rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  backdrop-filter: blur(12px);
  animation: logo-breathe 4s ease-in-out infinite;
}
@keyframes logo-breathe {
  0%,100% { box-shadow: 0 8px 32px rgba(155,143,245,0.20), inset 0 1px 0 rgba(255,255,255,0.08); }
  50%      { box-shadow: 0 8px 48px rgba(155,143,245,0.40), inset 0 1px 0 rgba(255,255,255,0.10); }
}

.auth-title {
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 600;
  text-align: center;
  background: linear-gradient(135deg, #e8607a 0%, #c490f5 50%, #9b8ff5 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  letter-spacing: 0.01em;
  line-height: 1.1;
}
.auth-sub {
  text-align: center;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 0.8rem;
  letter-spacing: 0.4px;
  font-weight: 400;
  margin-bottom: 34px;
}

/* ── Tabs ── */
.auth-tabs {
  display: flex;
  background: rgba(255,255,255,0.03);
  border-radius: var(--r-sm);
  padding: 4px;
  gap: 3px;
  margin-bottom: 26px;
  border: 1px solid var(--glass-border);
}
.auth-tab {
  flex: 1;
  padding: 10px 0;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 600;
  border-radius: 7px;
  cursor: pointer;
  transition: background .22s, color .22s, box-shadow .22s;
  letter-spacing: 0.2px;
}
.auth-tab.active {
  background: linear-gradient(160deg, rgba(155,143,245,0.18), rgba(232,96,122,0.10));
  color: var(--text);
  border: 1px solid rgba(155,143,245,0.22);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.auth-tab:not(.active):hover { color: rgba(240,236,252,0.65); }

/* ── Fields ── */
.field { margin-bottom: 12px; }
.field input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  padding: 13px 16px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 400;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
  -webkit-appearance: none;
}
.field input::placeholder { color: var(--muted-2); }
.field input:focus {
  border-color: rgba(155,143,245,0.45);
  background: rgba(155,143,245,0.05);
  box-shadow: 0 0 0 3px rgba(155,143,245,0.12);
}

/* ── Error ── */
.auth-error {
  font-family: var(--font-body);
  font-size: 0.79rem;
  color: var(--danger);
  min-height: 18px;
  margin-bottom: 8px;
  padding-left: 2px;
  display: none;
  font-weight: 500;
}
.auth-error.show { display: block; }

/* ── Submit ── */
.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #9b8ff5, #e8607a);
  border: none;
  border-radius: var(--r-sm);
  color: #fff;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 4px 24px rgba(155,143,245,0.30), 0 2px 8px rgba(232,96,122,0.20);
  margin-top: 4px;
  letter-spacing: 0.3px;
}
.btn-submit:hover {
  opacity: 0.88;
  box-shadow: 0 6px 32px rgba(155,143,245,0.46), 0 4px 16px rgba(232,96,122,0.30);
}
.btn-submit:active { transform: scale(0.98); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Shake ── */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  18%      { transform: translateX(-9px); }
  36%      { transform: translateX(9px); }
  54%      { transform: translateX(-5px); }
  72%      { transform: translateX(5px); }
}
.shake { animation: shake .42s var(--ease-smooth); }

/* ══════════════════════════════════════════
   CHAT SCREEN
══════════════════════════════════════════ */
#chat-screen {
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
}

/* ── Header ── */
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(10,8,18,0.8);
  backdrop-filter: blur(24px) saturate(130%);
  -webkit-backdrop-filter: blur(24px) saturate(130%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
/* Subtle shimmer under header */
.chat-header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 12%; right: 12%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(155,143,245,0.3), rgba(232,96,122,0.2), transparent);
  pointer-events: none;
}

.header-left { display: flex; align-items: center; gap: 16px; }

.btn-back-home {
  background: none;
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 7px 12px;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: color .15s, border-color .15s, background .15s;
  min-height: 36px;
  white-space: nowrap;
}
.btn-back-home:hover {
  color: var(--text);
  border-color: rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.04);
}

.chat-brand { display: flex; align-items: center; gap: 10px; }
.chat-brand-name {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 600;
  background: linear-gradient(135deg, #e8607a, #9b8ff5);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.02em;
  line-height: 1;
}
.chat-brand-status {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-body);
  font-size: 0.72rem;
  color: var(--teal);
  font-weight: 500;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 8px var(--teal);
  animation: pulse-dot 2.4s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.85); }
}

.header-right { display: flex; align-items: center; gap: 10px; }
.user-chip {
  font-family: var(--font-body);
  font-size: 0.76rem;
  font-weight: 500;
  color: var(--muted);
  background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  padding: 5px 14px;
  backdrop-filter: blur(8px);
  white-space: nowrap;
}
.btn-logout {
  background: none;
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 7px 13px;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
  min-height: 36px;
}
.btn-logout:hover {
  color: var(--text);
  border-color: rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.04);
}

/* ── Messages area ── */
.messages-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 32px 0;
  scroll-behavior: smooth;
  position: relative;
}
.messages-wrap::-webkit-scrollbar { width: 4px; }
.messages-wrap::-webkit-scrollbar-track { background: transparent; }
.messages-wrap::-webkit-scrollbar-thumb { background: rgba(155,143,245,0.2); border-radius: 2px; }
.messages-wrap::-webkit-scrollbar-thumb:hover { background: rgba(155,143,245,0.35); }

.messages-inner {
  max-width: 740px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 100%;
}

/* ── Welcome state ── */
.welcome-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;
  gap: 14px;
  flex: 1;
}
.welcome-icon {
  font-size: 44px;
  margin-bottom: 4px;
  opacity: 0.75;
  animation: welcome-float 3.5s ease-in-out infinite;
}
@keyframes welcome-float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
.welcome-quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 1.45rem;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.4;
  max-width: 380px;
  letter-spacing: 0.01em;
}
.welcome-sub {
  font-family: var(--font-body);
  font-size: 0.82rem;
  color: var(--muted-2);
  max-width: 300px;
  line-height: 1.6;
}

/* ── Messages ── */
.msg {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  animation: msg-in .3s var(--ease-spring);
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-ai  { flex-direction: row; }
.msg-user { flex-direction: row-reverse; }

.msg-avatar {
  width: 34px; height: 34px;
  border-radius: 11px;
  background: linear-gradient(160deg, rgba(155,143,245,0.18), rgba(232,96,122,0.10));
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
}

.msg-bubble {
  max-width: 72%;
  padding: 13px 18px;
  border-radius: 20px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  line-height: 1.68;
  position: relative;
  word-break: break-word;
}

/* AI bubble — glass */
.msg-ai .msg-bubble {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.07);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
  border-bottom-left-radius: 5px;
  color: var(--text);
}

/* User bubble — gradient */
.msg-user .msg-bubble {
  background: linear-gradient(135deg, #e8607a, #9b8ff5);
  border-bottom-right-radius: 5px;
  color: #fff;
  box-shadow: 0 4px 20px rgba(232,96,122,0.25), 0 2px 8px rgba(155,143,245,0.20);
}

/* Inline markdown */
.msg-bubble strong { font-weight: 700; }
.msg-ai .msg-bubble strong { color: rgba(240,236,252,0.9); }
.msg-bubble em { font-style: italic; opacity: 0.8; }
.msg-bubble code {
  font-family: 'Courier New', monospace;
  font-size: 0.81rem;
  background: rgba(155,143,245,0.13);
  padding: 1px 6px;
  border-radius: 4px;
  color: #c4b5fd;
}

/* ── Typing indicator ── */
.typing-row {
  display: flex; align-items: flex-end; gap: 10px;
  animation: msg-in .25s var(--ease-smooth);
}
.typing-bubble {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px; border-bottom-left-radius: 5px;
  padding: 14px 18px;
  display: flex; gap: 5px; align-items: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(155,143,245,0.65);
  animation: bounce-dot 1s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: .16s; }
.typing-dot:nth-child(3) { animation-delay: .32s; }
@keyframes bounce-dot {
  0%,60%,100% { transform: translateY(0); opacity: 0.45; }
  30%          { transform: translateY(-7px); opacity: 1; }
}

/* ── Input area ── */
.chat-input-wrap {
  background: rgba(10,8,18,0.82);
  backdrop-filter: blur(24px) saturate(120%);
  -webkit-backdrop-filter: blur(24px) saturate(120%);
  border-top: 1px solid rgba(255,255,255,0.07);
  padding: 16px 24px 20px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.chat-input-inner {
  max-width: 740px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  padding: 10px 10px 10px 20px;
  transition: border-color .22s, box-shadow .22s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.chat-input-inner:focus-within {
  border-color: rgba(155,143,245,0.38);
  box-shadow: 0 0 0 3px rgba(155,143,245,0.10), inset 0 1px 0 rgba(255,255,255,0.04);
}

.chat-input-inner textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 400;
  line-height: 1.6;
  resize: none;
  max-height: 160px;
  overflow-y: auto;
  padding: 4px 0;
  caret-color: var(--lavender);
}
.chat-input-inner textarea::placeholder { color: var(--muted-2); }
.chat-input-inner textarea::-webkit-scrollbar { width: 3px; }
.chat-input-inner textarea::-webkit-scrollbar-thumb { background: rgba(155,143,245,0.2); border-radius: 2px; }

.btn-send {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #9b8ff5, #e8607a);
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity .15s, transform .15s, box-shadow .2s;
  box-shadow: 0 2px 12px rgba(155,143,245,0.30), 0 1px 4px rgba(232,96,122,0.20);
  min-width: 40px;
}
.btn-send:hover {
  opacity: 0.85;
  box-shadow: 0 4px 20px rgba(155,143,245,0.50), 0 2px 8px rgba(232,96,122,0.30);
}
.btn-send:active { transform: scale(0.92); }
.btn-send:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-send svg {
  width: 17px; height: 17px;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.chat-disclaimer {
  max-width: 740px;
  margin: 9px auto 0;
  font-family: var(--font-body);
  font-size: 0.69rem;
  color: var(--muted-2);
  text-align: center;
  letter-spacing: 0.15px;
  line-height: 1.5;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .auth-card {
    padding: 40px 24px 36px;
    border-radius: var(--r-lg);
  }
  .auth-title { font-size: 2rem; }
  .chat-header { padding: 12px 16px; }
  .btn-back-home span { display: none; }
  .user-chip { display: none; }
  .messages-inner { padding: 0 14px; gap: 14px; }
  .msg-bubble { max-width: 86%; font-size: 0.86rem; }
  .chat-input-wrap { padding: 12px 14px 16px; }
  .chat-brand-name { font-size: 1.15rem; }
  .chat-brand-status { display: none; }
}

@media (max-width: 375px) {
  .auth-card { padding: 36px 20px 32px; }
  .auth-title { font-size: 1.85rem; }
  .btn-back-home { padding: 7px 10px; }
  .btn-logout { padding: 7px 10px; font-size: 0.75rem; }
}
</style>
</head>
<body>

<!-- Orbs -->
<div class="orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<!-- Particle field -->
<div class="particles" id="particles" aria-hidden="true"></div>

<!-- ════════════════════════════
     AUTH SCREEN
════════════════════════════ -->
<div class="screen" id="auth-screen">
  <div class="auth-card" id="auth-card">

    <!-- Logo -->
    <div class="auth-logo-wrap">
      <div class="auth-logo">🌙</div>
    </div>

    <h1 class="auth-title">Shugi AI</h1>
    <p class="auth-sub">Personal Mental Health Assistant</p>

    <!-- Tab switcher -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" id="tab-login"
              role="tab" aria-selected="true"
              onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register"
              role="tab" aria-selected="false"
              onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Login form -->
    <form id="form-login" onsubmit="submitAuth(event,'login')" novalidate>
      <div class="field">
        <input type="text" id="login-user" placeholder="Username"
               autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <input type="password" id="login-pass" placeholder="Password"
               autocomplete="current-password" required>
      </div>
      <div class="auth-error" id="err-login" role="alert"></div>
      <button type="submit" class="btn-submit" id="btn-login">
        <span>Sign In</span>
        <div class="spinner" id="spin-login"></div>
      </button>
    </form>

    <!-- Register form -->
    <form id="form-register" style="display:none" onsubmit="submitAuth(event,'register')" novalidate>
      <div class="field">
        <input type="text" id="reg-user" placeholder="Username"
               autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <input type="email" id="reg-email" placeholder="Email (optional)"
               autocomplete="email">
      </div>
      <div class="field">
        <input type="password" id="reg-pass" placeholder="Password (min 6 chars)"
               autocomplete="new-password" required minlength="6">
      </div>
      <div class="auth-error" id="err-register" role="alert"></div>
      <button type="submit" class="btn-submit" id="btn-register">
        <span>Create Account</span>
        <div class="spinner" id="spin-register"></div>
      </button>
    </form>

  </div>
</div>

<!-- ════════════════════════════
     CHAT SCREEN
════════════════════════════ -->
<div class="screen hidden" id="chat-screen"
     style="flex-direction:column; align-items:stretch; justify-content:flex-start;">

  <!-- Sticky header -->
  <header class="chat-header">
    <div class="header-left">
      <button class="btn-back-home" onclick="window.location.href='/'" title="Back to home">
        ← <span>Home</span>
      </button>
      <div class="chat-brand">
        <div>
          <div class="chat-brand-name">Shugi AI</div>
          <div class="chat-brand-status">
            <span class="status-dot" aria-hidden="true"></span>
            Online
          </div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <span class="user-chip" id="user-chip" aria-label="Signed in as"></span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </header>

  <!-- Messages -->
  <div class="messages-wrap" id="messages-wrap" role="log" aria-live="polite">
    <div class="messages-inner" id="messages">
      <!-- JS populates messages here -->
    </div>
  </div>

  <!-- Input bar -->
  <div class="chat-input-wrap">
    <div class="chat-input-inner">
      <textarea
        id="msg-input"
        placeholder="Share what's on your mind…"
        rows="1"
        onkeydown="inputKeydown(event)"
        oninput="autoResize(this)"
        aria-label="Message input"
      ></textarea>
      <button class="btn-send" id="send-btn" onclick="sendMessage()" title="Send message" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="chat-disclaimer">
      Shugi is an AI, not a substitute for professional therapy. In a crisis, please contact a helpline.
    </p>
  </div>

</div>

<script>
// ── Config ──
const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? ''
  : 'https://api.shugiai.com';

// ── State ──
let TOKEN    = localStorage.getItem('shugiToken');
let USERNAME = localStorage.getItem('shugiUsername');
let isStreaming  = false;
let currentTab   = 'login';

// ── Init ──
(async function init() {
  spawnParticles();
  if (TOKEN) {
    try {
      const res = await fetch(API + '/api/auth/me', {
        headers: { Authorization: 'Bearer ' + TOKEN }
      });
      if (res.ok) {
        const d = await res.json();
        USERNAME = d.username;
        showChat();
        return;
      }
    } catch {}
    TOKEN = null;
    localStorage.removeItem('shugiToken');
    localStorage.removeItem('shugiUsername');
  }
  showAuth();
})();

// ── Particles ──
function spawnParticles() {
  const wrap = document.getElementById('particles');
  const colors = [
    'rgba(155,143,245,0.55)',
    'rgba(232,96,122,0.45)',
    'rgba(46,196,182,0.35)',
    'rgba(240,236,252,0.30)'
  ];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 1.2 + Math.random() * 2;
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      width: ${size}px;
      height: ${size}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-duration: ${9 + Math.random() * 16}s;
      animation-delay: ${-Math.random() * 22}s;
    `;
    wrap.appendChild(p);
  }
}

// ── Screen transitions ──
function showAuth() {
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('chat-screen').classList.add('hidden');
}

function showChat() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('chat-screen').classList.remove('hidden');
  const chip = document.getElementById('user-chip');
  chip.textContent = '✦ ' + USERNAME;
  chip.setAttribute('aria-label', 'Signed in as ' + USERNAME);

  const msgs = document.getElementById('messages');
  if (!msgs.children.length) renderWelcome(msgs);

  setTimeout(() => document.getElementById('msg-input').focus(), 300);
}

// ── Welcome state ──
function renderWelcome(container) {
  const div = document.createElement('div');
  div.className = 'welcome-state';
  div.id = 'welcome-state';
  div.innerHTML = `
    <div class="welcome-icon">🌙</div>
    <p class="welcome-quote">"This is a safe space. Take your time."</p>
    <p class="welcome-sub">I'm here to listen — without judgment, without rushing you. What's on your mind today?</p>
  `;
  container.appendChild(div);
}

function removeWelcome() {
  document.getElementById('welcome-state')?.remove();
}

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;
  const isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('tab-login').setAttribute('aria-selected', isLogin);
  document.getElementById('tab-register').setAttribute('aria-selected', !isLogin);
  document.getElementById('form-login').style.display    = isLogin ? '' : 'none';
  document.getElementById('form-register').style.display = isLogin ? 'none' : '';
  document.getElementById('err-login').classList.remove('show');
  document.getElementById('err-register').classList.remove('show');
}

// ── Auth submit ──
async function submitAuth(e, mode) {
  e.preventDefault();
  const errEl   = document.getElementById('err-' + mode);
  const btn     = document.getElementById('btn-' + mode);
  const spin    = document.getElementById('spin-' + mode);
  const label   = btn.querySelector('span');

  let body;
  if (mode === 'login') {
    body = {
      username: document.getElementById('login-user').value.trim(),
      password: document.getElementById('login-pass').value
    };
  } else {
    body = {
      username: document.getElementById('reg-user').value.trim(),
      email:    document.getElementById('reg-email').value.trim() || null,
      password: document.getElementById('reg-pass').value
    };
  }

  if (!body.username || !body.password) return;

  btn.disabled        = true;
  label.style.display = 'none';
  spin.style.display  = 'block';
  errEl.classList.remove('show');

  try {
    const endpoint = API + (mode === 'login' ? '/api/auth/login' : '/api/auth/register');
    const res = await fetch(endpoint, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body)
    });
    let data = {};
    try { data = await res.json(); } catch {}

    if (!res.ok) {
      errEl.textContent = data.detail || data.error || `Error ${res.status}`;
      errEl.classList.add('show');
      const card = document.getElementById('auth-card');
      card.classList.remove('shake');
      void card.offsetWidth; // reflow to restart animation
      card.classList.add('shake');
    } else {
      TOKEN    = data.token;
      USERNAME = data.user ? data.user.username : (data.username || 'user');
      localStorage.setItem('shugiToken', TOKEN);
      localStorage.setItem('shugiUsername', USERNAME);
      showChat();
    }
  } catch (err) {
    errEl.textContent = (err && err.message)
      ? 'Error: ' + err.message
      : 'Connection error. Is the server running?';
    errEl.classList.add('show');
  } finally {
    btn.disabled        = false;
    label.style.display = '';
    spin.style.display  = 'none';
  }
}

// ── Logout ──
async function logout() {
  try {
    await fetch(API + '/api/auth/logout', {
      method:  'POST',
      headers: { Authorization: 'Bearer ' + TOKEN }
    });
  } catch {}
  TOKEN = null; USERNAME = null;
  localStorage.removeItem('shugiToken');
  localStorage.removeItem('shugiUsername');
  document.getElementById('messages').innerHTML = '';
  showAuth();
}

// ── Markdown renderer ──
function sageMd(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

// ── Append messages ──
function appendUser(text) {
  removeWelcome();
  const msgs = document.getElementById('messages');
  const div  = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<div class="msg-bubble">${sageMd(text)}</div>`;
  msgs.appendChild(div);
  scrollBottom();
}

function appendAI(text) {
  removeWelcome();
  const msgs = document.getElementById('messages');
  const div  = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML = `
    <div class="msg-avatar" aria-hidden="true">🌙</div>
    <div class="msg-bubble">${sageMd(text)}</div>
  `;
  msgs.appendChild(div);
  scrollBottom();
  return div.querySelector('.msg-bubble');
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const el   = document.createElement('div');
  el.className = 'typing-row';
  el.id        = 'typing-row';
  el.setAttribute('aria-label', 'Shugi is typing');
  el.innerHTML = `
    <div class="msg-avatar" aria-hidden="true">🌙</div>
    <div class="typing-bubble" aria-hidden="true">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  msgs.appendChild(el);
  scrollBottom();
}

function hideTyping() {
  document.getElementById('typing-row')?.remove();
}

function scrollBottom() {
  const wrap = document.getElementById('messages-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

// ── Send message ──
async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  appendUser(text);

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const res = await fetch(API + '/api/chat', {
      method:  'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN
      },
      body: JSON.stringify({ message: text })
    });

    if (res.status === 401) {
      hideTyping();
      TOKEN = null;
      localStorage.removeItem('shugiToken');
      localStorage.removeItem('shugiUsername');
      showAuth();
      return;
    }

    hideTyping();
    const bubble = appendAI('');
    bubble.innerHTML = '';

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText  = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const raw = line.slice(6);
          if (raw === '[DONE]') break;
          try {
            const d     = JSON.parse(raw);
            const piece = d.token ?? d.content ?? d.text ?? '';
            if (piece) {
              fullText += piece;
              bubble.innerHTML = sageMd(fullText);
              scrollBottom();
            }
          } catch {}
        }
      }
    }
  } catch (err) {
    hideTyping();
    appendAI('Something went wrong. Please try again.');
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

// ── Input helpers ──
function inputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
</script>
</body>
</html>
